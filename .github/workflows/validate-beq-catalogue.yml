name: Validate upstream BEQ catalogue

on:
  push:
    branches:
      - perf/hosted-beq-catalogue
    paths:
      - ".github/workflows/validate-beq-catalogue.yml"
      - "tools/build_beq_catalogue.py"
      - "tools/validate_beq_catalogue.py"
      - "tests/test_validate_beq_catalogue.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beq-catalogue-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run unit tests
        run: python -m pytest -q

      - name: Fetch upstream catalogue
        run: |
          curl --fail --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 180 \
            https://beqcatalogue.readthedocs.io/en/latest/database.json \
            --output /tmp/beq-database.json

      - name: Build and structurally validate without publishing
        run: |
          python tools/build_beq_catalogue.py \
            --source /tmp/beq-database.json \
            --output /tmp/beq-validation
          python tools/validate_beq_catalogue.py /tmp/beq-validation | tee /tmp/beq-validation-summary.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path("/tmp/beq-validation-summary.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## Upstream BEQ catalogue validation\n\n")
              output.write(f"- Source version: `{summary['version']}`\n")
              output.write(f"- Source SHA-256: `{summary['source_sha256']}`\n")
              output.write(f"- Playable entries: {summary['entry_count']:,}\n")
              output.write(f"- Filterless entries: {summary['filterless_count']:,}\n")
              output.write(f"- Integration-unsupported entries: {summary['unsupported_count']:,}\n")
              output.write(f"- Entries with normalized filter values: {summary['adjusted_count']:,}\n")
              output.write(f"- Entry payload files checked: {summary['payload_files_checked']:,}\n")
              output.write("\nNo GitHub Pages deployment is performed by this workflow.\n")
          PY

      - name: Upload validation reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beq-catalogue-validation-reports
          path: |
            /tmp/beq-validation/manifest.json
            /tmp/beq-validation/filterless-entries.json
            /tmp/beq-validation/filterless-entries.txt
            /tmp/beq-validation/unsupported-entries.json
            /tmp/beq-validation/unsupported-entries.txt
            /tmp/beq-validation/adjusted-entries.json
            /tmp/beq-validation/adjusted-entries.txt
          if-no-files-found: error
          retention-days: 14
