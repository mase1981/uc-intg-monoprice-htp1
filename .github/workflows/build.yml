name: "Build & Draft Release"

"on":
  push:
    branches:
      - main
  workflow_dispatch:

env:
  INTG_NAME: monoprice_htp1
  PYTHON_VER: 3.11.12-0.3.0

jobs:
  check:
    name: Check for new version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check whether version needs a release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version driver.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Existing tag or release (published or draft) for this version?
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ] || \
             gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].tag_name' | grep -qx "v$VERSION"; then
            echo "v$VERSION already released, nothing to do"
            echo "release=false" >> $GITHUB_OUTPUT
          else
            echo "release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: [check]
    if: needs.check.outputs.release == 'true'
    name: Build Release
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.get-version-and-id.outputs.VERSION }}
      driver_id: ${{ steps.get-version-and-id.outputs.DRIVER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 200

      - name: Get version and id
        id: get-version-and-id
        run: |
          VERSION=${{ needs.check.outputs.version }}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DRIVER_ID=$(jq .driver_id -r driver.json)" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "DRIVER_ID=$(jq .driver_id -r driver.json)" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          echo "Starting pyinstaller build for driver_id: ${DRIVER_ID}"
          docker run --rm --name builder \
            --platform=linux/arm64 \
            --user=$(id -u):$(id -g) \
            -v ${GITHUB_WORKSPACE}:/workspace \
            docker.io/unfoldedcircle/r2-pyinstaller:${PYTHON_VER} \
            bash -c \
            "cd /workspace && \
              python -m pip install -r requirements.txt && \
              pyinstaller --clean --onedir --name driver \
                --add-data driver.json:. \
                --collect-all zeroconf \
                --collect-all ucapi \
                --collect-all ucapi_framework \
                --collect-all certifi \
                --hidden-import intg_${INTG_NAME}.driver \
                --hidden-import intg_${INTG_NAME}.device \
                --hidden-import intg_${INTG_NAME}.config \
                --hidden-import intg_${INTG_NAME}.media_player \
                --hidden-import intg_${INTG_NAME}.remote \
                --hidden-import intg_${INTG_NAME}.sensor \
                --hidden-import intg_${INTG_NAME}.selector \
                --hidden-import intg_${INTG_NAME}.browser \
                --hidden-import intg_${INTG_NAME}.displayvalues \
                --hidden-import intg_${INTG_NAME}.setup_flow \
                --paths . \
                intg_${INTG_NAME}/__init__.py"

      - name: Verify bundled CA certificates
        shell: bash
        run: |
          if ! find dist/driver -type f -path '*/certifi/cacert.pem' -print -quit | grep -q .; then
            echo "certifi CA bundle missing from PyInstaller output" >&2
            exit 1
          fi

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts/bin
          mv dist/driver/* artifacts/bin/
          cp driver.json artifacts/
          # Copy icon file to archive root (required format: custom:$ICON_FILENAME)
          [[ -f assets/monoprice-logo.png ]] && cp assets/monoprice-logo.png artifacts/
          echo "ARTIFACT_NAME=uc-intg-${{ env.DRIVER_ID }}-${{ env.VERSION }}-aarch64" >> $GITHUB_ENV
          echo "=== Artifact structure ==="
          ls -laR artifacts/

      - name: Create upload artifact archive
        shell: bash
        run: |
          tar czvf ${{ env.ARTIFACT_NAME }}.tar.gz -C ${GITHUB_WORKSPACE}/artifacts .
          echo "=== Archive contents ==="
          tar tzvf ${{ env.ARTIFACT_NAME }}.tar.gz
          ls -lah ${{ env.ARTIFACT_NAME }}.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: upload_artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    needs: [check, build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/uc-intg-monoprice-htp1
          tags: |
            type=raw,value=v${{ needs.check.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [build, docker]
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: uc-intg-*

      - name: Extract build archives from downloaded files
        run: |
          ls -R
          for D in *; do
            if [ -d "${D}" ]; then
              mv "${D}"/* ./
            fi
          done

      - name: Create hash file
        run: |
          for filename in *.tar.gz; do
            echo "sha256 $(sha256sum "$filename")" >> ${{needs.build.outputs.driver_id}}.hash
          done

      - name: Create release draft
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: "*.tar.gz,${{needs.build.outputs.driver_id}}.hash"
          draft: true
          generateReleaseNotes: true
          artifactErrorsFailBuild: true
          tag: v${{needs.build.outputs.version}}
          commit: ${{ github.sha }}
