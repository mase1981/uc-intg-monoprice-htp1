name: Publish BEQ catalogue

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: beq-catalogue-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The publisher workflow is also available from main, but its builder and
      # catalogue source files live on the hosted-catalogue feature branch.
      - name: Checkout integration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: perf/hosted-beq-catalogue

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Fetch upstream catalogue
        run: |
          curl --fail --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 180 \
            https://beqcatalogue.readthedocs.io/en/latest/database.json \
            --output /tmp/beq-database.json

      - name: Fetch upstream license notices
        run: |
          curl --fail --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            https://raw.githubusercontent.com/3ll3d00d/beqcatalogue/master/LICENSE \
            --output /tmp/beqcatalogue-LICENSE
          curl --fail --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            https://raw.githubusercontent.com/3ll3d00d/beqfilters/main/LICENSE \
            --output /tmp/beqfilters-LICENSE
          test -s /tmp/beqcatalogue-LICENSE
          test -s /tmp/beqfilters-LICENSE

      - name: Build compact catalogue
        run: |
          python tools/build_beq_catalogue.py \
            --source /tmp/beq-database.json \
            --output public/beq

      - name: Validate generated catalogue
        run: python tools/validate_beq_catalogue.py public/beq

      - name: Include upstream license notices
        run: |
          cp /tmp/beqcatalogue-LICENSE public/beq/BEQCATALOGUE-LICENSE
          cp /tmp/beqfilters-LICENSE public/beq/BEQFILTERS-LICENSE

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
